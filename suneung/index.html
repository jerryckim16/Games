<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Suneung Simulator</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <div class="top">
      <h1 data-t="app.title">Suneung Simulator</h1>
      <button type="button" id="cutToggle" class="cut-toggle" aria-pressed="true"></button>
      <div class="seg lang lang-switch" id="lang" role="group" aria-label="Language / 언어">
        <button type="button" data-v="en" lang="en" aria-pressed="false">English</button>
        <button type="button" data-v="ko" lang="ko" aria-pressed="false">한국어</button>
      </div>
    </div>
    <p class="sub" data-t="app.sub"></p>
  </header>

  <main>
    <!-- ---------- new life ---------- -->
    <section id="setup" class="hidden">
      <div class="panel setup-panel">
        <div class="hero" id="setupArt"></div>
        <h2 data-t="setup.title"></h2>
        <p class="intro" data-t="setup.intro"></p>
        <div class="setup-row">
          <div class="field">
            <span class="flabel" id="sexLabel" data-t="setup.sex"></span>
            <div class="seg sex" id="sex" role="group" aria-labelledby="sexLabel">
              <button type="button" data-v="m" data-t="sex.m"></button>
              <button type="button" data-v="f" data-t="sex.f"></button>
            </div>
          </div>
          <div class="field name-field">
            <label for="name" data-t="setup.name"></label>
            <input id="name" type="text" maxlength="20">
          </div>
        </div>
        <div class="buttons">
          <button id="startBtn" type="button" class="primary" data-t="setup.go"></button>
        </div>
        <div class="daily">
          <button id="dailyBtn" type="button"></button>
          <small id="dailyNote" data-t="daily.note"></small>
        </div>
      </div>
      <div class="panel">
        <h2 class="panel-title"><span aria-hidden="true">🏆 </span><span data-t="fame.title"></span> <span class="muted" data-t="fame.sub"></span></h2>
        <div class="table-wrap"><table class="grid" id="fame"></table></div>
      </div>
      <div class="panel">
        <h2 class="panel-title"><span aria-hidden="true">🏅 </span><span data-t="ach.title"></span> <span class="muted" id="achSub"></span></h2>
        <div id="achList"></div>
      </div>
      <div class="panel">
        <h2 class="panel-title"><span aria-hidden="true">🕰️ </span><span data-t="lives.title"></span> <span class="muted" data-t="lives.sub"></span></h2>
        <div id="lives" class="life-cards"></div>
      </div>
    </section>

    <!-- ---------- the game ---------- -->
    <section id="game" class="hidden">
      <!-- Your life right now: an illustrated scene with you in it, your mood, and the basics. On a phone
           the map folds into the place chip and the stats into a two-row strip, so the plan comes first. -->
      <section class="life">
        <div class="life-top">
          <div class="scene-wrap">
            <div id="scene" class="scene-box"></div>
            <div id="mood" class="bubble" aria-live="polite"><b id="moodName"></b><span id="moodText"></span></div>
          </div>
          <div class="map-side">
            <div class="map-head"><span id="mapHome"></span><small id="mapHint"></small></div>
            <div id="mainMap" class="main-map"></div>
            <div class="map-legend" id="mapLegend"></div>
          </div>
        </div>
        <button type="button" id="placeChip" class="place-chip"><span class="pc-name" id="placeName"></span><span class="pc-go" id="placeGo"></span></button>
        <div class="stats">
          <div class="stat"><span class="ic" aria-hidden="true">📅</span><span class="k" data-t="stat.date"></span><span class="v" id="sDate"></span><span class="s" id="sDday"></span></div>
          <div class="stat"><span class="ic" aria-hidden="true">🎒</span><span class="k" data-t="stat.attempt"></span><span class="v" id="sAttempt"></span><span class="s" id="sStatus"></span></div>
          <div class="stat"><span class="ic" aria-hidden="true">🎂</span><span class="k" data-t="stat.age"></span><span class="v" id="sAge"></span><span class="s" id="sName"></span></div>
          <div class="stat"><span class="ic" aria-hidden="true">💰</span><span class="k" data-t="stat.money"></span><span class="v" id="sMoney"></span><span class="s" id="sAllowance"></span></div>
          <div class="stat fam" id="sFamCard"><span class="ic" aria-hidden="true">🏠</span><span class="k" data-t="stat.family"></span><div class="chips" id="sFam"></div><span class="s" id="sFamSub"></span></div>
        </div>
      </section>

      <!-- What the last turn did, in a few chips: built from the turn's log entry and the stats before it. -->
      <section id="turnSum" class="turn-sum hidden" aria-live="polite"></section>

      <div class="row">
        <section class="panel stats-panel" id="statsPanel">
          <button type="button" class="fold-head" id="statsFold" aria-expanded="true" aria-controls="statsBody"><span data-t="stats.title"></span><span class="chev" aria-hidden="true"></span></button>
          <div class="fold-body" id="statsBody">
            <h2><span data-t="ability.title"></span> <span class="muted" data-t="ability.sub"></span></h2>
            <div id="skills" class="bars"></div>
            <div id="traits" class="traits" aria-live="polite"></div>
            <h2 class="gap" data-t="cond.title"></h2>
            <div id="condition" class="bars"></div>
            <div class="chart-head gap">
              <h2 data-t="chart.title"></h2>
              <div class="legend" id="legend"></div>
            </div>
            <canvas id="chart" role="img"></canvas>
          </div>
        </section>

        <section class="panel plan">
          <div class="plan-head">
            <h2 id="planTitle"></h2>
            <!-- Big, rare decisions live in a menu, away from the Next button. -->
            <div class="menu-wrap">
              <button type="button" id="lifeBtn" class="ghost" aria-haspopup="true" aria-expanded="false" aria-controls="lifeMenu"><span data-t="life.menu"></span> <span aria-hidden="true">⋯</span></button>
              <div id="lifeMenu" class="menu hidden" role="menu">
                <button id="moveBtn" type="button" role="menuitem"><span aria-hidden="true">🚚 </span><span data-t="move.btn"></span></button>
                <button id="quitBtn" type="button" role="menuitem" class="danger-text"><span aria-hidden="true">🚪 </span><span data-t="quit.btn"></span></button>
                <button id="newLifeBtn" type="button" role="menuitem"><span aria-hidden="true">🌱 </span><span data-t="newLife"></span></button>
              </div>
            </div>
          </div>
          <small id="lessonNote" class="lesson-note"></small>
          <div class="field method-field">
            <span class="flabel" id="methodLabel" data-t="plan.method"></span>
            <div class="seg wrap" id="method" role="group" aria-labelledby="methodLabel"></div>
            <small id="methodNote"></small>
          </div>
          <small class="tap-hint" data-t="plan.tap"></small>
          <div id="activities" class="acts"></div>
          <div class="plan-foot">
            <span id="planCost" class="muted"></span>
            <span id="planErr" class="err" role="alert"></span>
          </div>
          <div class="buttons plan-tools">
            <button id="repeatBtn" type="button" data-t="plan.repeat"></button>
            <button id="clearBtn" type="button" data-t="plan.clear"></button>
          </div>
          <!-- The turn bar sticks to the bottom of the screen while the plan is in view: the turn's time
               as slots, how much is left, and Next. -->
          <div class="turnbar" id="turnbar">
            <div id="slots" class="slots"></div>
            <div class="turnbar-row">
              <span id="blocksLeft" class="pill" aria-live="polite"></span>
              <small id="fullHint" class="full-hint" aria-live="polite"></small>
              <button id="nextBtn" type="button" class="primary"></button>
            </div>
          </div>
        </section>
      </div>

      <!-- The people in your life: classmates, friends, a rival, a crush, the homeroom teacher. -->
      <section class="panel people-panel">
        <h2 class="panel-title"><span aria-hidden="true">🧑‍🤝‍🧑 </span><span data-t="people.title"></span> <span class="muted" data-t="people.sub"></span></h2>
        <p id="peopleTeacher" class="people-teacher hidden"></p>
        <div id="people" class="people"></div>
        <small id="peopleNote" class="people-note"></small>
      </section>

      <div class="row">
        <section class="panel diary">
          <h2 class="panel-title"><span aria-hidden="true">📔 </span><span data-t="log.title"></span></h2>
          <ul id="log" class="log"></ul>
        </section>
        <section class="panel">
          <h2 class="panel-title"><span aria-hidden="true">📝 </span><span data-t="history.title"></span></h2>
          <div class="table-wrap"><table class="grid" id="history"></table></div>
          <div class="buttons end">
            <button id="endBtn" type="button" class="hidden" data-t="end.reopen"></button>
            <button id="achBtn" type="button" data-t="ach.btn"></button>
            <button id="livesBtn" type="button" data-t="lives.btn"></button>
          </div>
        </section>
      </div>
    </section>

    <!-- "A year goes by": a calendar page between turns. Purely visual, so it never blocks clicks. -->
    <div id="turn" class="turn hidden" aria-hidden="true">
      <div class="turn-card"><span class="turn-cap" id="turnCap"></span><span class="turn-date" id="turnDate"></span><span class="turn-age" id="turnAge"></span></div>
    </div>
    <div id="confetti" class="confetti" aria-hidden="true"></div>
    <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
  </main>

  <div id="modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-card">
      <!-- The page behind a dialog is inert, so the dialog carries its own language switch. -->
      <div class="seg lang lang-switch modal-lang" role="group" aria-label="Language / 언어">
        <button type="button" data-v="en" lang="en" aria-pressed="false">English</button>
        <button type="button" data-v="ko" lang="ko" aria-pressed="false">한국어</button>
      </div>
      <div id="modalArt" class="modal-art hidden"></div>
      <h2 id="modalTitle"></h2>
      <div id="modalBody"></div>
      <div id="modalButtons" class="buttons"></div>
    </div>
  </div>

  <!-- Cutscenes: a letterboxed film over everything, shot by shot (app.js plays them, art.js draws them). -->
  <div id="cut" class="cut hidden" role="dialog" aria-modal="true">
    <div class="cut-progress" id="cutProg" aria-hidden="true"></div>
    <div class="cut-top">
      <div class="seg lang lang-switch cut-lang" role="group" aria-label="Language / 언어">
        <button type="button" data-v="en" lang="en" aria-pressed="false">English</button>
        <button type="button" data-v="ko" lang="ko" aria-pressed="false">한국어</button>
      </div>
      <button type="button" id="cutSkip" class="cut-skip"></button>
    </div>
    <div class="cut-frame" id="cutFrame"></div>
    <p class="cut-cap" id="cutCap" aria-live="polite"></p>
    <span class="cut-hint" id="cutHint" aria-hidden="true"></span>
  </div>

  <!-- First-turn coach marks: a ring around one part of the screen and a short bubble, shown once. -->
  <div id="coach" class="coach hidden" role="dialog" aria-modal="false" aria-labelledby="coachText">
    <div class="coach-ring" id="coachRing" aria-hidden="true"></div>
    <div class="coach-bubble" id="coachBubble">
      <p id="coachText"></p>
      <div class="coach-btns"><span class="coach-step" id="coachStep"></span><button type="button" id="coachSkip" class="ghost" data-t="coach.skip"></button><button type="button" id="coachNext" class="primary"></button></div>
    </div>
  </div>

  <script src="places.js"></script>
  <script src="engine.js"></script>
  <script src="strings.js"></script>
  <script src="art.js"></script>
  <script src="app.js"></script>
</body>
</html>
